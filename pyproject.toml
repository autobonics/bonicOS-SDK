[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bonicos"
description = "One Python SDK for every BonicBot — transport-agnostic, replaces bonicbot (BLE) and bonicbot-bridge (ROS)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Autobonics Team", email = "admin@autobonics.com"}
]
maintainers = [
    {name = "Autobonics Team", email = "admin@autobonics.com"}
]
keywords = [
    "robot", "robotics", "servo", "control", "websocket", "webrtc",
    "humanoid", "bonicbot", "bonicos", "hardware", "automation", "education"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# Ubuntu 22.04 (ROS humble's target OS — every bare-metal robot) ships
# Python 3.10 as system python3; the run_code runner venv on those robots is
# built with it. No 3.11-only syntax is used
# anywhere in this package, so >=3.11 was only ever a conservative default,
# not a real requirement — lowered to match what actually needs to install.
requires-python = ">=3.10"
# The WebSocket transport is the only way this SDK reaches a robot, so
# `websockets` is a base dependency: `pip install bonicos` must produce a
# package that can actually connect. It was previously the optional `native`
# extra, on the theory that a Pyodide install shouldn't have to pull it — but
# the browser now runs against MockTransport only (no robot behind it), so
# nothing installs this package without needing a real transport.
# transports/websocket.py still lazy-imports it inside connect(); that rule is
# about import time, not about packaging.
dependencies = [
    "websockets>=12.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# mDNS autodiscovery (discovery.py) — optional, native only.
discovery = [
    "zeroconf>=0.132",
]
# Camera video on the native SDK. Video is WebRTC-only, so receiving+decoding
# it needs aiortc (brings av) + numpy; lazy-imported in transports/_camera_link.py
# so a driving-only install never pays for them. Absent in Pyodide (the host
# decodes video there). Install with `pip install bonicos[camera]`.
camera = [
    "aiortc>=1.6",
    "numpy>=1.21",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    # Needed to exercise webrtc.py's camera-frame decode path in tests.
    # Upper-bounded (unlike the [camera] extra's numpy>=1.21) because numpy
    # >=2.1's bundled stubs use `type` statement syntax requiring Python
    # 3.12+, which crashes mypy outright under this project's
    # python_version = "3.11" target — a dev-tooling constraint, not a real
    # runtime incompatibility, so it doesn't belong on the [camera] extra.
    "numpy>=1.21,<2.1",
]

[project.urls]
Homepage = "https://github.com/Autobonics/bonicOS-SDK"
Documentation = "https://github.com/Autobonics/bonicOS-SDK/blob/main/API.md"
Repository = "https://github.com/Autobonics/bonicOS-SDK.git"
"Bug Tracker" = "https://github.com/Autobonics/bonicOS-SDK/issues"

[tool.setuptools]
packages = ["bonicos", "bonicos.controllers", "bonicos.transports"]

[tool.setuptools.package-data]
bonicos = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "bonicos.__version__"}

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# zeroconf is an optional extra (discovery.py) and ships no type stubs.
[[tool.mypy.overrides]]
module = ["zeroconf"]
ignore_missing_imports = true
